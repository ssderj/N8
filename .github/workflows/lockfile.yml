name: Create lockfile and check build

on: workflow_dispatch

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Inkroot_v143
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm audit --audit-level=high
        continue-on-error: true
      - name: Save the lockfile
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add package-lock.json
          git commit -m "Add package-lock.json" || echo "nothing to commit"
          git push
